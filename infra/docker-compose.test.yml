# ==============================================================================
# BuggyBooks — Ephemeral CI/Local Test Environment
#
# Provides isolated, hermetic container instances of BuggyBooks:
#   - Backend: Node.js/Express API on port 4000
#   - Frontend: Nginx-served static SPA on port 5173 (proxied to localhost:4000/api)
#
# Non-negotiable rule: NO VOLUMES. Each test run begins with clean, pristine state.
# ==============================================================================

services:
  backend:
    image: ghcr.io/munna7862/buggy-books-backend:${BUGGYBOOKS_TAG:-latest}
    container_name: buggy-books-backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-ci-test-secret}
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    image: ghcr.io/munna7862/buggy-books-frontend:${BUGGYBOOKS_FE_TAG:-ci-localhost}
    container_name: buggy-books-frontend
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
