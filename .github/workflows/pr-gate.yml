name: PR Quality Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  static-quality:
    name: Static Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Monorepo Workspace Linting
        run: npm run lint:all

      - name: Monorepo Workspace Typechecking
        run: npm run typecheck:all

      - name: Generate Static Quality Summary
        if: always()
        run: |
          echo "### 🔍 Static Quality Check" >> $GITHUB_STEP_SUMMARY
          echo "- **ESLint**: Passed across all monorepo workspaces" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript**: Passed (tsc --noEmit) with 0 errors" >> $GITHUB_STEP_SUMMARY

  smoke-e2e:
    name: Smoke Tests (Chrome UI + API)
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: 'true'
      ENV: INTEROP
      BASE_URL: https://buggy-books-fe.onrender.com/
      API_BASE_URL: https://buggy-books.onrender.com
      USER_NAME: ${{ secrets.E2E_USER_NAME }}
      PASSWORD: ${{ secrets.E2E_PASSWORD }}
      TZ: Australia/Adelaide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Render Staging Warm-Up Pre-Flight Probe
        run: |
          echo "Probing BuggyBooks staging endpoints for cold-start wake-up..."
          curl -s -o /dev/null https://buggy-books.onrender.com/api/books || true
          curl -s -o /dev/null https://buggy-books-fe.onrender.com/ || true
          npx wait-on -t 90000 https://buggy-books.onrender.com/api/books
          npx wait-on -t 90000 https://buggy-books-fe.onrender.com/
          echo "Restoring clean staging application state and resetting chaos parameters..."
          curl -s -X POST https://buggy-books.onrender.com/api/test/config \
            -H "Content-Type: application/json" \
            -d '{"checkoutFailureRate": 0, "inventoryDelayMs": 0, "visualChaos": false}' || true
          curl -s -X POST https://buggy-books.onrender.com/api/test/reset || true

      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      - name: Run Smoke Tests
        run: npm run test:smoke:all

      - name: Teardown Staging State Reset
        if: always()
        run: |
          echo "Restoring staging application state and resetting chaos parameters..."
          curl -s -X POST https://buggy-books.onrender.com/api/test/config \
            -H "Content-Type: application/json" \
            -d '{"checkoutFailureRate": 0, "inventoryDelayMs": 0, "visualChaos": false}' || true
          curl -s -X POST https://buggy-books.onrender.com/api/test/reset || true

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-smoke-artifacts
          path: |
            playwright-e2e/reports/monocart-report/
            playwright-e2e/reports/test-artifacts/
            playwright-e2e/test-results/
          retention-days: 7

      - name: Generate PR Quality Gate Summary
        if: always()
        run: |
          echo "### 🛡️ PR Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result | Environment | Target / Browser |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Static Quality & Linting** | ${{ needs.static-quality.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Monorepo Workspaces | Node.js 22 (lint + typecheck) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Smoke Tests (UI & API)** | ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} | BuggyBooks Staging | Google Chrome (Channel: chrome) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Quality Gate SLA**: Fast-feedback verification (< 3 min) validating static quality, Render staging warm-up, single-browser Chrome smoke execution, and automated teardown state reset." >> $GITHUB_STEP_SUMMARY
