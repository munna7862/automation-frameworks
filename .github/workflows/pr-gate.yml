# ==============================================================================
# BuggyBooks — PR Quality Gate (Fast-Feedback CI SLA < 3m)
# ==============================================================================

name: PR Quality Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  static-quality:
    name: Static Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'false'

      - name: Monorepo Workspace Linting
        id: lint
        run: npm run lint:all

      - name: Monorepo Workspace Typechecking
        id: typecheck
        run: npm run typecheck:all

      - name: Prettier Code Formatting
        id: prettier
        run: npm run format:check

      - name: Dual-Catalog Parity Validation
        id: catalog
        run: npm run test:verify-catalog

      - name: OpenAPI Specification Lint & Drift Gate
        id: openapi
        run: |
          npm run openapi:lint
          npm run openapi:generate
          git diff --exit-code docs/api/openapi.yaml

      - name: Generate Static Quality Summary
        if: always()
        run: |
          echo "### 🔍 Static Quality Check" >> $GITHUB_STEP_SUMMARY
          echo "- **ESLint**: ${{ steps.lint.outcome == 'success' && '✅ Passed across all monorepo workspaces' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript**: ${{ steps.typecheck.outcome == 'success' && '✅ Passed (tsc --noEmit) with 0 errors' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Prettier**: ${{ steps.prettier.outcome == 'success' && '✅ Passed with consistent code style' || '❌ Formatting issues detected' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dual-Catalog Parity**: ${{ steps.catalog.outcome == 'success' && '✅ 100% byte-for-byte verified (docs vs playwright-e2e)' || '❌ Out of sync' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenAPI 3.1 Spec**: ${{ steps.openapi.outcome == 'success' && '✅ Lint clean (Redocly) and zero drift' || '❌ Drift or lint failure' }}" >> $GITHUB_STEP_SUMMARY

  commitlint:
    name: Conventional Commits Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR Commits with Commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.cjs

  smoke-e2e:
    name: Smoke Tests (Chrome UI + API)
    needs: [static-quality, commitlint]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      CI: 'true'
      ENV: DOCKER
      TARGET_ENV: DOCKER
      BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:4000
      USER_NAME: ${{ secrets.E2E_USER_NAME }}
      PASSWORD: ${{ secrets.E2E_PASSWORD }}
      TZ: Australia/Adelaide

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'true'

      - name: Start Ephemeral BuggyBooks Environment
        uses: ./.github/actions/buggybooks-up

      - name: Pre-Flight State Reset
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Run Smoke Tests
        id: tests
        run: npm run test:smoke:all
        continue-on-error: true

      - name: Teardown State Reset
        if: always()
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Stop Ephemeral BuggyBooks Environment
        if: always()
        uses: ./.github/actions/buggybooks-down

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: pr-gate-smoke-artifacts
          path: |
            playwright-e2e/reports/monocart-report/
            playwright-e2e/reports/test-artifacts/
            playwright-e2e/test-results/
          retention-days: 7

      - name: Summarize Test Results
        if: always()
        run: |
          node scripts/summarize-test-results.js playwright-e2e/test-results/results.json

      - name: Generate PR Quality Gate Summary
        if: always()
        run: |
          {
            echo "### 🛡️ PR Quality Gate Results"
            echo ""
            echo "| Stage | Result | Environment | Target / Browser |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **Static Quality & Linting** | ${{ needs.static-quality.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Monorepo Workspaces | Node.js $(cat .nvmrc) (lint + typecheck) |"
            echo "| **Smoke Tests (UI & API)** | ${{ steps.tests.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} | Ephemeral BuggyBooks (DOCKER) | Google Chrome (Channel: chrome) |"
            echo ""
            echo "> **Quality Gate SLA**: Fast-feedback verification (< 3 min) validating static quality, hermetic ephemeral BuggyBooks containers, single-browser Chrome smoke execution, and automated teardown state reset."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if smoke tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "::error::Smoke test execution failed — check artifacts and summaries"
          exit 1

  burn-in:
    name: Flake Burn-In (Changed Specs 5x)
    needs: [smoke-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      CI: 'true'
      ENV: DOCKER
      TARGET_ENV: DOCKER
      BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:4000
      USER_NAME: ${{ secrets.E2E_USER_NAME }}
      PASSWORD: ${{ secrets.E2E_PASSWORD }}
      TZ: Australia/Adelaide

    steps:
      - name: Checkout repository (full history for --only-changed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'true'

      - name: Check for Changed Test Specs
        id: check-changes
        run: |
          SPEC_FILES=$(git diff --name-only origin/main...HEAD -- 'playwright-e2e/src/tests/**/*.spec.ts' | sed 's|^playwright-e2e/||' | tr '\n' ' ' || true)
          SPEC_FILES_TRIMMED=$(echo "$SPEC_FILES" | xargs)
          if [ -n "$SPEC_FILES_TRIMMED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "specs=$SPEC_FILES_TRIMMED" >> $GITHUB_OUTPUT
            echo "Detected explicitly changed specs: $SPEC_FILES_TRIMMED"
          else
            OTHER_CHANGES=$(git diff --name-only origin/main...HEAD -- 'playwright-e2e/src/**/*.ts' || true)
            if [ -n "$(echo "$OTHER_CHANGES" | xargs)" ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "specs=" >> $GITHUB_OUTPUT
              echo "Detected internal Playwright src changes without direct spec edits. Using --only-changed."
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "No Playwright specs or source files modified in this PR. Burn-in no-op."
            fi
          fi

      - name: Start Ephemeral BuggyBooks Environment
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/buggybooks-up

      - name: Pre-Flight State Reset
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Run Playwright Burn-In (5x Repeat, 0 Retries)
        if: steps.check-changes.outputs.has_changes == 'true'
        id: burnin
        working-directory: playwright-e2e
        run: |
          if [ -n "${{ steps.check-changes.outputs.specs }}" ]; then
            npx playwright test --config=src/config/playwright.config.ts \
              ${{ steps.check-changes.outputs.specs }} --repeat-each=5 --retries=0 --workers=1
          else
            npx playwright test --config=src/config/playwright.config.ts \
              --only-changed=origin/main --repeat-each=5 --retries=0 --workers=1
          fi
        continue-on-error: true

      - name: Teardown State Reset
        if: always() && steps.check-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Stop Ephemeral BuggyBooks Environment
        if: always() && steps.check-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/buggybooks-down

      - name: Upload Burn-In Artifacts
        if: always() && steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: pr-gate-burn-in-artifacts
          path: |
            playwright-e2e/reports/monocart-report/
            playwright-e2e/reports/test-artifacts/
            playwright-e2e/test-results/
          retention-days: 7

      - name: Generate Burn-In Step Summary
        if: always()
        run: |
          {
            echo "### 🔥 PR Flake Burn-In Results"
            echo ""
            if [ "${{ steps.check-changes.outputs.has_changes }}" != "true" ]; then
              echo "ℹ️ **No test specs changed against \`origin/main\`** — Burn-in test execution skipped (no-op)."
            elif [ "${{ steps.burnin.outcome }}" == "success" ]; then
              echo "✅ **All changed test specs passed 5x repeats deterministically with 0 retries!**"
              echo "- **Target Environment**: Ephemeral BuggyBooks (\`ENV=DOCKER\`)"
              echo "- **Repetitions**: 5 per changed spec (\`--repeat-each=5 --retries=0\`)"
            else
              echo "❌ **Flaky or failing tests detected during 5x burn-in execution!**"
              echo ""
              echo "> ⚠️ Any test that fails under \`--retries=0\` must be stabilized or quarantined before merge."
              echo "> See the [Quarantine Lifecycle Guide](docs/quarantine_lifecycle_guide.md) for remediation protocols."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail Burn-In Gate If Flakes/Failures Detected
        if: always() && steps.check-changes.outputs.has_changes == 'true' && steps.burnin.outcome == 'failure'
        run: |
          echo "::error::Burn-in test execution failed! One or more changed specs failed across 5 repeats with 0 retries."
          exit 1

  lighthouse:
    name: Lighthouse CI (Google Chrome)
    needs: [static-quality, commitlint]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'true'

      - name: Check for Page Changes
        id: check-pages
        run: |
          PAGE_CHANGES=$(git diff --name-only origin/main...HEAD -- 'playwright-e2e/src/pages/**' 'lighthouserc.json' || true)
          if [ -n "$(echo "$PAGE_CHANGES" | xargs)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Detected page or LHCI config changes: $PAGE_CHANGES"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No page or LHCI config changes in this PR. Lighthouse no-op."
          fi

      - name: Start Ephemeral BuggyBooks Environment
        if: steps.check-pages.outputs.has_changes == 'true'
        uses: ./.github/actions/buggybooks-up

      - name: Run Lighthouse CI Audits
        if: steps.check-pages.outputs.has_changes == 'true'
        id: lhci
        run: |
          npx @lhci/cli autorun --config=lighthouserc.json
        continue-on-error: true

      - name: Stop Ephemeral BuggyBooks Environment
        if: always() && steps.check-pages.outputs.has_changes == 'true'
        uses: ./.github/actions/buggybooks-down

      - name: Upload Lighthouse Reports Artifact
        if: always() && steps.check-pages.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            AutomationReports/Lighthouse/
          retention-days: 7

      - name: Generate Lighthouse Step Summary
        if: always()
        run: |
          {
            echo "### 🚦 Lighthouse CI Audit Results"
            echo ""
            if [ "${{ steps.check-pages.outputs.has_changes }}" != "true" ]; then
              echo "ℹ️ **No page objects modified in this PR** — Lighthouse audit skipped (no-op)."
            elif [ "${{ steps.lhci.outcome }}" == "success" ]; then
              echo "✅ **Lighthouse CI budgets met across audited routes!**"
              echo "- **Performance**: ≥ 0.8"
              echo "- **Accessibility**: ≥ 0.90"
              echo "- **Best Practices**: ≥ 0.9"
              echo "- **SEO**: ≥ 0.8 (warn)"
            else
              echo "❌ **Lighthouse CI assertions failed or reported budget violations.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on Lighthouse Outcome
        if: always() && steps.check-pages.outputs.has_changes == 'true' && steps.lhci.outcome == 'failure'
        run: |
          echo "::error::Lighthouse CI audit failed assertions."
          exit 1
