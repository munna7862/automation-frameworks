# ==============================================================================
# BuggyBooks — Playwright Automation CI (Thin Caller)
# ==============================================================================

name: Playwright Automation CI

on:
  push:
    branches: [main]
    paths:
      - 'playwright-e2e/**'
      - 'packages/playwright-utils/**'
      - '.github/workflows/playwright-ci.yml'
      - '.github/workflows/_reusable-e2e.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run browser in headless mode'
        required: false
        default: 'true'
      project:
        description: 'Playwright project (chrome, api, or blank for all)'
        required: false
        default: ''
      grep:
        description: 'Tag or title filter pattern (e.g. @smoke)'
        required: false
        default: ''
      shards:
        description: 'Playwright shard count'
        required: false
        default: 4
        type: number
      use-docker-image:
        description: 'Run in official Playwright Docker container'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  playwright-e2e:
    uses: ./.github/workflows/_reusable-e2e.yml
    with:
      framework: playwright
      project: ${{ inputs.project || '' }}
      grep: ${{ inputs.grep || '' }}
      shards: ${{ inputs.shards || 4 }}
      use-docker-image: ${{ inputs.use-docker-image || false }}
      publish-allure: true
      allure-namespace: Playwright
      headless: ${{ inputs.headless || 'true' }}
    secrets: inherit
