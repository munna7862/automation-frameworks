name: k6 Performance Benchmarking CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'k6-performance/**'
      - '.github/workflows/k6-performance.yaml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'k6 Scenario to execute'
        required: true
        default: 'smoke-load.js'
        type: choice
        options:
          - 'smoke-load.js'
          - 'catalog-load.js'
          - 'ecommerce-journey.js'
          - 'checkout-stress.js'
          - 'inventory-stress.js'
          - 'auth-stress.js'
      vus:
        description: 'Virtual Users (VUs)'
        required: false
        default: '5'
        type: string
      duration:
        description: 'Test duration (e.g. 10s, 30s)'
        required: false
        default: '10s'
        type: string
      target_host:
        description: 'Target API Host URL'
        required: false
        default: 'https://buggy-books.onrender.com'
        type: string

jobs:
  k6-benchmark-and-drift-gate:
    name: k6 Performance & Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      BASE_URL: ${{ inputs.target_host || 'https://buggy-books.onrender.com' }}
      VUS: ${{ inputs.vus || '5' }}
      DURATION: ${{ inputs.duration || '10s' }}
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'false'

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.1.0

      - name: Render Staging Warm-Up Pre-Flight Probe
        uses: ./.github/actions/staging-warmup
        with:
          api-url: ${{ env.BASE_URL }}/api/books

      - name: Execute k6 Performance Benchmark
        id: run-k6
        shell: bash
        run: |
          SCENARIO="${{ inputs.scenario || 'smoke-load.js' }}"
          echo "Executing k6 scenario: ${SCENARIO} with ${VUS} VUs for ${DURATION}..."
          npm run perf:smoke --workspace=k6-performance

      - name: Run Relative Baseline Drift Regression Gate
        id: drift-gate
        shell: bash
        run: |
          echo "Evaluating response time drift against golden baseline..."
          npm run perf:drift-check --workspace=k6-performance

      - name: Teardown Staging State Reset
        if: always()
        uses: ./.github/actions/chaos-reset
        with:
          api-base: ${{ env.BASE_URL }}

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: k6-performance-reports
          path: |
            k6-performance/report.html
            k6-performance/perf-summary*.json
            k6-performance/k6-summary.md
          retention-days: 14
