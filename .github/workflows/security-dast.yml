# ==============================================================================
# BuggyBooks — Dynamic Application Security Testing (DAST with OWASP ZAP)
#
# Target Environment:
#   - Ephemeral DOCKER: Uses .github/actions/buggybooks-up hermetic containers.
#   - STRICT SCOPE GUARD: Target URL must strictly match ^http://localhost(:\d+)?/
#   - NEVER runs active scans or attack payloads against Render shared staging.
#
# Workstream Breakdown:
#   1. zap-baseline : Passive scan on PR against frontend SPA (http://localhost:5173)
#   2. zap-api-scan : Active scan nightly against REST API via docs/api/openapi.yaml
#   3. zap-proxy-crawl : Optional authenticated smoke crawl through ZAP proxy
#
# Governance:
#   - Rules configured in security/zap-rules.tsv and security/zap-api-rules.tsv
#   - Results converted to SARIF 2.1.0 for GitHub Code Scanning integration
# ==============================================================================

name: Security - DAST (OWASP ZAP)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'playwright-e2e/**'
      - 'security/**'
      - 'scripts/zap-to-sarif.js'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/security-dast.yml'
  schedule:
    - cron: '0 4 * * *' # Nightly at 04:00 UTC
  workflow_dispatch:
    inputs:
      zap_proxy_crawl:
        description: 'Run Playwright smoke journeys through ZAP proxy'
        type: boolean
        default: false
        required: false

concurrency:
  group: security-dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ============================================================================
  # Job 1: ZAP Passive Baseline Scan (PR Quality Gate)
  # ============================================================================
  zap-baseline:
    name: ZAP Baseline Passive Scan (PR)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Scope Guard - Verify Target URL
        shell: bash
        env:
          TARGET_URL: 'http://localhost:5173'
        run: |
          echo "🛡️ Validating target URL against localhost scope guard..."
          if [[ ! "$TARGET_URL" =~ ^http://localhost(:[0-9]+)?(/.*)?$ ]]; then
            echo "❌ CRITICAL SECURITY ERROR: Target '$TARGET_URL' violates localhost scope guard!"
            echo "Active scanning or payloads are strictly prohibited outside disposable local containers."
            exit 1
          fi
          echo "✅ Target '$TARGET_URL' verified within localhost scope guard."

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'false'

      - name: Start Ephemeral BuggyBooks Environment
        uses: ./.github/actions/buggybooks-up

      - name: Pre-Flight State Reset
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Prepare Report Output Files
        shell: bash
        run: |
          mkdir -p security
          touch zap-baseline.html zap-baseline.json || true
          chmod 777 zap-baseline.html zap-baseline.json || true

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: 'http://localhost:5173'
          rules_file_name: 'security/zap-rules.tsv'
          cmd_options: '-a -r zap-baseline.html -J zap-baseline.json'
          allow_issue_writing: false
          fail_action: true

      - name: Adjust Report Permissions
        if: always()
        shell: bash
        run: |
          sudo chmod -R 777 zap-baseline* 2>/dev/null || true

      - name: Convert ZAP Baseline JSON to SARIF
        if: always()
        shell: bash
        run: |
          node scripts/zap-to-sarif.js \
            --input=zap-baseline.json \
            --output=zap-baseline.sarif \
            --category=zap-baseline

      - name: Upload ZAP Baseline SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: zap-baseline.sarif
          category: zap-baseline

      - name: Upload ZAP Baseline Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: zap-baseline-report
          path: |
            zap-baseline.html
            zap-baseline.json
            zap-baseline.sarif
          retention-days: 14

      - name: Teardown State Reset
        if: always()
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Stop Ephemeral BuggyBooks Environment
        if: always()
        uses: ./.github/actions/buggybooks-down

      - name: Generate ZAP Baseline Step Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 🛡️ OWASP ZAP Passive Baseline Scan Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "| :--- | :--- |"
            echo "| **Target Environment** | Ephemeral DOCKER (\`http://localhost:5173\`) |"
            echo "| **Scan Type** | Passive Baseline with Alpha Rules (\`-a\`) |"
            echo "| **Rules Configuration** | \`security/zap-rules.tsv\` |"
            echo "| **SARIF Category** | \`zap-baseline\` |"
            echo ""
            if [ -f "$GITHUB_WORKSPACE/zap-baseline.html" ]; then
              echo "✅ ZAP baseline HTML report generated."
            else
              echo "⚠️ ZAP baseline HTML report not located."
            fi
            if [ -f "$GITHUB_WORKSPACE/zap-baseline.sarif" ]; then
              echo "✅ SARIF vulnerability report prepared for GitHub Code Scanning."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Job 2: ZAP Active API Scan (Nightly & Dispatch)
  # ============================================================================
  zap-api-scan:
    name: ZAP Active API Scan (Nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Scope Guard - Verify Target URL
        shell: bash
        env:
          TARGET_URL: 'http://localhost:4000'
        run: |
          echo "🛡️ Validating API target URL against localhost scope guard..."
          if [[ ! "$TARGET_URL" =~ ^http://localhost(:[0-9]+)?(/.*)?$ ]]; then
            echo "❌ CRITICAL SECURITY ERROR: Target '$TARGET_URL' violates localhost scope guard!"
            echo "Active scanning or payloads are strictly prohibited outside disposable local containers."
            exit 1
          fi
          echo "✅ Target '$TARGET_URL' verified within localhost scope guard."

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'false'

      - name: Start Ephemeral BuggyBooks Environment
        uses: ./.github/actions/buggybooks-up

      - name: Pre-Flight State Reset
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Acquire Seeded Authentication Token (No Bypass Headers)
        id: auth
        shell: bash
        run: |
          echo "Obtaining JWT bearer token for authorized endpoints (without bypass headers)..."
          TOKEN_RESPONSE=$(curl -s -X POST http://localhost:4000/api/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"password123"}')
          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "⚠️ Could not acquire seed token; scan will proceed with unauthenticated endpoints."
            echo "token=" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Acquired seed bearer token."
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare API Scan Context & Files
        shell: bash
        run: |
          mkdir -p security
          touch zap-api.html zap-api.json || true
          chmod 777 zap-api.html zap-api.json || true

      - name: Run OWASP ZAP API Active Scan
        uses: zaproxy/action-api-scan@bd24b11e76da11ab60302c8ae87f091cbb11f034 # v0.10.0
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
        with:
          target: 'docs/api/openapi.yaml'
          format: 'openapi'
          rules_file_name: 'security/zap-api-rules.tsv'
          cmd_options: >-
            -r zap-api.html
            -J zap-api.json
            -n security/zap-api-context.context
            -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement='Bearer ${{ steps.auth.outputs.token }}'"
          fail_action: false

      - name: Adjust API Report Permissions
        if: always()
        shell: bash
        run: |
          sudo chmod -R 777 zap-api* 2>/dev/null || true

      - name: Convert ZAP API JSON to SARIF
        if: always()
        shell: bash
        run: |
          node scripts/zap-to-sarif.js \
            --input=zap-api.json \
            --output=zap-api.sarif \
            --category=zap-api

      - name: Upload ZAP API SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: zap-api.sarif
          category: zap-api

      - name: Upload ZAP API Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: zap-api-report
          path: |
            zap-api.html
            zap-api.json
            zap-api.sarif
          retention-days: 14

      - name: Stage Report for Executive Portal
        if: always()
        shell: bash
        run: |
          mkdir -p AutomationReports/Security/ZAP/latest
          if [ -f "zap-api.html" ]; then
            cp zap-api.html AutomationReports/Security/ZAP/latest/index.html
          fi
          if [ -f "zap-api.json" ]; then
            cp zap-api.json AutomationReports/Security/ZAP/latest/report.json
          fi

      - name: Teardown State Reset
        if: always()
        uses: ./.github/actions/chaos-reset
        with:
          api-base: http://localhost:4000

      - name: Stop Ephemeral BuggyBooks Environment
        if: always()
        uses: ./.github/actions/buggybooks-down

      - name: Generate ZAP API Scan Step Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 🛡️ OWASP ZAP Active API Scan Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "| :--- | :--- |"
            echo "| **Target Specification** | \`docs/api/openapi.yaml\` (OpenAPI 3.1) |"
            echo "| **Target Base URL** | \`http://localhost:4000\` |"
            echo "| **Chaos Exclusions** | Excluded \`^/api/test/\` via context |"
            echo "| **Authentication** | Bearer JWT (seed \`admin\` user, no bypass headers) |"
            echo "| **SARIF Category** | \`zap-api\` |"
            echo ""
            if [ -f "$GITHUB_WORKSPACE/zap-api.html" ]; then
              echo "✅ ZAP active API HTML report generated."
            else
              echo "⚠️ ZAP active API HTML report not located."
            fi
            if [ -f "$GITHUB_WORKSPACE/zap-api.sarif" ]; then
              echo "✅ SARIF vulnerability report prepared for GitHub Code Scanning."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Job 3: Optional ZAP Proxy Crawl (Playwright @smoke via ZAP Proxy)
  # ============================================================================
  zap-proxy-crawl:
    name: ZAP Proxy Passive Crawl (Optional)
    if: github.event.inputs.zap_proxy_crawl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'true'

      - name: Start Ephemeral BuggyBooks Environment
        uses: ./.github/actions/buggybooks-up

      - name: Launch ZAP Daemon as Local Proxy (:8090)
        shell: bash
        run: |
          echo "Starting OWASP ZAP daemon proxy on port 8090..."
          docker run -d --name zap-proxy --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true
          npx wait-on -t 30000 http://localhost:8090/

      - name: Execute Playwright Smoke Crawl through ZAP Proxy
        shell: bash
        env:
          HTTP_PROXY: http://localhost:8090
          HTTPS_PROXY: http://localhost:8090
          ENV: DOCKER
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:4000
        run: |
          npm run test:smoke --workspace=playwright-e2e || true

      - name: Collect ZAP Proxy Passive Alerts
        if: always()
        shell: bash
        run: |
          curl -s "http://localhost:8090/JSON/core/view/alerts/" > zap-proxy-alerts.json || true
          docker stop zap-proxy || true

      - name: Stop Ephemeral BuggyBooks Environment
        if: always()
        uses: ./.github/actions/buggybooks-down
