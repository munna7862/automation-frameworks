name: Mobile Appium Automation CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions: {}

jobs:
  android-test:
    name: Android Appium E2E Specs
    concurrency:
      group: buggybooks-staging-state
      cancel-in-progress: false
    runs-on: macos-14
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      CI: 'true'
      BASE_URL: https://buggy-books-fe.onrender.com/
      API_BASE_URL: https://buggy-books.onrender.com
      ANDROID_DEVICE_NAME: 'pixel_6'
      ANDROID_PLATFORM_VERSION: '12.0'
      USER_NAME: ${{ secrets.E2E_USER_NAME }}
      PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Render Staging Warm-Up Pre-Flight Probe
        uses: ./.github/actions/staging-warmup

      - name: Run Android Emulator Tests
        id: tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.33.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: npm run test:mobile:smoke
        continue-on-error: true

      - name: Generate Standardized Allure Environment Metadata
        if: always()
        run: |
          node scripts/generate-allure-environment.js --framework=mobile

      - name: Upload Mobile Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: mobile-allure-results
          path: mobile-automation/allure-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail job if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "::error::Test execution failed — see Allure report"
          exit 1

      - name: Generate Mobile CI Summary
        if: always()
        run: |
          echo "### 📱 Mobile Appium CI Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: macos-14 (Hardware Accelerated)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Device**: Pixel 6 (API Level 31, x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- **Appium Driver**: UiAutomator2" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Command**: \`npm run test:mobile:smoke\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Outcome**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  deploy-report:
    name: Deploy Mobile Allure Report
    concurrency:
      group: pages-deploy-allure
      cancel-in-progress: false
    needs: [android-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Checkout gh-pages for Historical Trend Data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch
          persist-credentials: false

      - name: Download Mobile Allure Results Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-allure-results
          path: mobile-allure-results

      - name: Inject Previous Allure History
        run: |
          if [ -d "gh-pages-branch/AutomationReports/Mobile/history" ]; then
            echo "Found existing Allure history for Mobile. Injecting into results..."
            mkdir -p mobile-allure-results/history
            cp -r gh-pages-branch/AutomationReports/Mobile/history/* mobile-allure-results/history/
          else
            echo "No previous history found for Mobile. Starting fresh trend baseline."
          fi

      - name: Generate Allure Report
        run: |
          allure generate mobile-allure-results --clean -o mobile-allure-report

      - name: Summarize Test Results
        if: always()
        run: |
          node scripts/summarize-test-results.js mobile-allure-report/widgets/summary.json

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: mobile-allure-report
          destination_dir: AutomationReports/Mobile
          keep_files: true

      - name: Generate Portal Metadata
        run: |
          node scripts/generate-portal-metadata.js --gh-pages-dir=gh-pages-branch --output=docs/portal/portal-data.json

      - name: Deploy Executive Portal to GitHub Pages Root
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/portal
          keep_files: true

      - name: Append Quality Gate Step Summary
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REPORT_URL="https://${OWNER}.github.io/${REPO_NAME}/AutomationReports/Mobile/"
          PORTAL_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          echo "## 📊 Mobile Allure Report & Executive Portal Published" >> $GITHUB_STEP_SUMMARY
          echo "- **Executive Portal**: [BuggyBooks Quality Portal](${PORTAL_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Mobile Dashboard**: [View Mobile Allure Dashboard](${REPORT_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`AutomationReports/Mobile\`" >> $GITHUB_STEP_SUMMARY
          echo "- **History Preservation**: Enabled (Trend charts preserved on \`gh-pages\`)" >> $GITHUB_STEP_SUMMARY
