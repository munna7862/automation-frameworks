# ==============================================================================
# BuggyBooks — Selenium Automation CI (Thin Caller)
# ==============================================================================

name: Selenium Automation CI

on:
  push:
    branches: [main]
    paths:
      - 'selenium-e2e/**'
      - '.github/workflows/selenium-ci.yml'
      - '.github/workflows/_reusable-e2e.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run browser in headless mode'
        required: false
        default: 'true'

permissions: {}

jobs:
  selenium-e2e:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/_reusable-e2e.yml
    with:
      framework: selenium
      shards: 1
      publish-allure: true
      allure-namespace: Selenium
      headless: ${{ inputs.headless || 'true' }}
    secrets:
      E2E_USER_NAME: ${{ secrets.E2E_USER_NAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
