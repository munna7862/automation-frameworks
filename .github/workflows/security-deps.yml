# ==============================================================================
# BuggyBooks — Dependency Security, Vulnerability Scanning & Compliance
# ==============================================================================

name: Security - Dependencies & SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review (PR Gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-ghsas: >-
            GHSA-r5fr-rjxr-66jc, GHSA-j3q9-mxjg-w52f, GHSA-37ch-88jc-xwx2, GHSA-27v5-c462-wpq7,
            GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3, GHSA-c475-qrg2-pj4r, GHSA-mrhx-c7xc-m3w5,
            GHSA-f23m-r3pf-42rh, GHSA-xxjr-mmjv-4gpg
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0,
            Python-2.0, PSF-2.0, BlueOak-1.0.0, MPL-2.0, Unlicense, CC-BY-3.0, CC-BY-4.0,
            WTFPL, Zlib, LGPL-3.0-or-later

  osv-scan:
    name: OSV Vulnerability Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
            --format=sarif
            --output=results.sarif

      - name: Upload OSV Scan SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: osv-scanner

  compliance-and-sbom:
    name: License Compliance, Audit & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'false'

      - name: License Compliance Audit
        run: |
          npx --yes license-checker-rseidelsohn --excludePrivatePackages --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Python-2.0;PSF-2.0;BlueOak-1.0.0;Unlicense;WTFPL;MPL-2.0;CC-BY-3.0;CC-BY-4.0;Zlib;(MIT OR CC0-1.0);(MIT OR GPL-3.0-or-later);(AFL-2.1 OR BSD-3-Clause);WTFPL OR ISC;(WTFPL OR MIT);MIT or GPL-2.0;(MIT AND Zlib);Apache-2.0 AND LGPL-3.0-or-later;LGPL-3.0-or-later;MIT*"

      - name: NPM Workspace Audit (Second Opinion)
        id: audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high --workspaces

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: monorepo-sbom.cyclonedx.json

      - name: Upload Monorepo SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.1
        with:
          name: monorepo-cyclonedx-sbom
          path: monorepo-sbom.cyclonedx.json
          retention-days: 14

      - name: Compliance & Audit Step Summary
        if: always()
        run: |
          {
            echo "### 📦 Dependency Compliance & SBOM Summary"
            echo "- **License Check**: ✅ Verified against approved open-source licenses allow-list"
            echo "- **NPM Audit (Second Opinion)**: ${{ steps.audit.outcome == 'success' && '✅ 0 High/Critical findings' || '⚠️ Advisory findings triaged in accepted risk register' }}"
            echo "- **CycloneDX SBOM**: ✅ Generated and attached as workflow artifact (monorepo-sbom.cyclonedx.json)"
          } >> "$GITHUB_STEP_SUMMARY"
