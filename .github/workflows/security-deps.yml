# ==============================================================================
# BuggyBooks — Dependency Security, Vulnerability Scanning & Compliance
# ==============================================================================

name: Security - Dependencies & SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review (PR Gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0,
            Python-2.0, BlueOak-1.0.0, MPL-2.0, Unlicense, CC-BY-3.0, CC-BY-4.0,
            WTFPL, Zlib

  osv-scan:
    name: OSV Vulnerability Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
            --output=results.sarif

      - name: Upload OSV Scan SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: osv-scanner

  compliance-and-sbom:
    name: License Compliance, Audit & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'false'

      - name: License Compliance Audit
        run: |
          npx --yes license-checker-rseidelsohn --excludePrivatePackages --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Python-2.0;BlueOak-1.0.0;Unlicense;WTFPL;MPL-2.0;CC-BY-3.0;CC-BY-4.0;Zlib;(MIT OR CC0-1.0);(MIT OR GPL-3.0-or-later);(AFL-2.1 OR BSD-3-Clause);WTFPL OR ISC;(WTFPL OR MIT);MIT or GPL-2.0;(MIT AND Zlib);Apache-2.0 AND LGPL-3.0-or-later;MIT*"

      - name: NPM Workspace Audit (Second Opinion)
        id: audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high --workspaces

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          format: cyclonedx-json
          output-file: monorepo-sbom.cyclonedx.json

      - name: Upload Monorepo SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: monorepo-cyclonedx-sbom
          path: monorepo-sbom.cyclonedx.json
          retention-days: 14

      - name: Compliance & Audit Step Summary
        if: always()
        run: |
          echo "### 📦 Dependency Compliance & SBOM Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **License Check**: ✅ Verified against approved open-source licenses allow-list" >> $GITHUB_STEP_SUMMARY
          echo "- **NPM Audit (Second Opinion)**: ${{ steps.audit.outcome == 'success' && '✅ 0 High/Critical findings' || '⚠️ Advisory findings triaged in accepted risk register' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CycloneDX SBOM**: ✅ Generated and attached as workflow artifact (`monorepo-sbom.cyclonedx.json`)" >> $GITHUB_STEP_SUMMARY
