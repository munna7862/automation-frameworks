# =============================================================
# BuggyBooks — Playwright Quarantine Stability Audit & Governance
#
# Runs weekly on a scheduled cron and on demand via workflow_dispatch.
# Executes quarantined tests with repetition (--repeat-each=5) to compute
# the Quarantine Stability Index, generating actionable de-quarantine
# recommendations directly in $GITHUB_STEP_SUMMARY.
# =============================================================

name: Quarantine Stability Audit

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Repetition count per quarantined test'
        required: false
        default: '5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quarantine-audit:
    name: Quarantined Test Stability Audit (5x Repetition)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: playwright-e2e

    env:
      ENV: INTEROP
      BASE_URL: https://buggy-books-fe.onrender.com/
      API_BASE_URL: https://buggy-books.onrender.com
      HEADLESS: 'true'
      REPEAT_EACH: ${{ github.event.inputs.repeat_each || '5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playwright-e2e/package-lock.json

      - name: Render Staging Warm-Up Pre-Flight Probe
        run: |
          curl -s -o /dev/null https://buggy-books.onrender.com/api/books || true
          curl -s -o /dev/null https://buggy-books-fe.onrender.com/ || true
          npx wait-on -t 90000 https://buggy-books.onrender.com/api/books
          npx wait-on -t 90000 https://buggy-books-fe.onrender.com/

      - name: Install Playwright Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Install Google Chrome & Dependencies
        working-directory: playwright-e2e
        run: |
          echo "Installing Google Chrome browser binary and system dependencies"
          npx playwright install --with-deps chrome

      - name: Run Quarantine Stability Audit Runner
        working-directory: playwright-e2e
        env:
          REPEAT_EACH: ${{ github.event.inputs.repeat_each || '5' }}
          ENVIRONMENT: INTEROP
          TZ: Australia/Adelaide
          BASE_URL: https://buggy-books-fe.onrender.com/
          API_BASE_URL: https://buggy-books.onrender.com
        run: |
          npm run test:quarantine:audit

      - name: Upload Quarantine Audit Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: quarantine-audit-report
          path: |
            playwright-e2e/reports/quarantine-audit.md
            playwright-e2e/quarantine-results.json
          retention-days: 14
