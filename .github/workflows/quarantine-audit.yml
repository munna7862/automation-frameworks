# =============================================================
# BuggyBooks — Playwright Quarantine Stability Audit & Governance
#
# Runs weekly on a scheduled cron and on demand via workflow_dispatch.
# Executes quarantined tests with repetition (--repeat-each=10) to compute
# the Quarantine Stability Index, generating actionable de-quarantine
# recommendations directly in $GITHUB_STEP_SUMMARY.
# =============================================================

name: Quarantine Stability Audit

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Repetition count per quarantined test'
        required: false
        default: '10'

concurrency:
  group: buggybooks-staging-state
  cancel-in-progress: false

permissions: {}

jobs:
  quarantine-audit:
    name: Quarantined Test Stability Audit (10x Repetition)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      ENV: INTEROP
      BASE_URL: https://buggy-books-fe.onrender.com/
      API_BASE_URL: https://buggy-books.onrender.com
      HEADLESS: 'true'
      REPEAT_EACH: ${{ github.event.inputs.repeat_each || '10' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Monorepo Environment
        uses: ./.github/actions/setup-monorepo
        with:
          install-chrome: 'true'

      - name: Render Staging Warm-Up
        uses: ./.github/actions/staging-warmup

      - name: Run Quarantine Stability Audit Runner
        working-directory: playwright-e2e
        env:
          REPEAT_EACH: ${{ github.event.inputs.repeat_each || '10' }}
          ENVIRONMENT: INTEROP
          TZ: Australia/Adelaide
          BASE_URL: https://buggy-books-fe.onrender.com/
          API_BASE_URL: https://buggy-books.onrender.com
        run: |
          npm run test:quarantine:audit

      - name: Upload Quarantine Audit Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: quarantine-audit-report
          path: |
            playwright-e2e/reports/quarantine-audit.md
            playwright-e2e/quarantine-results.json
          retention-days: 14
