# ==============================================================================
# BuggyBooks — WebdriverIO Automation CI (Thin Caller)
# ==============================================================================

name: WebdriverIO Automation CI

on:
  push:
    branches: [main]
    paths:
      - 'wdio-e2e/**'
      - '.github/workflows/wdio-ci.yml'
      - '.github/workflows/_reusable-e2e.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run browser in headless mode'
        required: false
        default: 'true'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  wdio-e2e:
    uses: ./.github/workflows/_reusable-e2e.yml
    with:
      framework: wdio
      shards: 1
      publish-allure: true
      allure-namespace: WDIO
      headless: ${{ inputs.headless || 'true' }}
    secrets: inherit
