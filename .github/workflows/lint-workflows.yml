# ==============================================================================
# BuggyBooks — Workflow Security & Syntax Linting (actionlint & zizmor)
# ==============================================================================

name: Security - Workflow Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint Workflow Linter
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Run actionlint in Docker
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -ignore 'SC\d+'

  zizmor:
    name: Zizmor Workflow Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Zizmor Workflow Audit
        id: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx run zizmor --format sarif .github/workflows/ > zizmor.sarif

      - name: Upload Zizmor SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor
