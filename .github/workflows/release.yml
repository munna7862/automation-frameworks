name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release Please & Versioning
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@7987652d64c45816db5417d54073a8626c712436 # v4.1.3
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Generate Release CycloneDX SBOM
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          format: cyclonedx-json
          output-file: release-sbom.cyclonedx.json

      - name: Upload SBOM to Release Assets
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -n "$TAG_NAME" ] && [ -f release-sbom.cyclonedx.json ]; then
            gh release upload "$TAG_NAME" release-sbom.cyclonedx.json --clobber || true
          fi
