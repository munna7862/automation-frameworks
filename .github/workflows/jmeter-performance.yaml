name: JMeter Performance CI

on:
  workflow_dispatch:
    inputs:
      test_plan:
        description: 'JMeter Test Plan to execute'
        required: true
        default: 'BuggyBooks_Catalog_Load'
        type: choice
        options:
          - 'BuggyBooks_Catalog_Load'
          - 'BuggyBooks_Auth_Stress'
          - 'BuggyBooks_Ecommerce_Journey'
          - 'BuggyBooks_Inventory_Stress'

      thread_count:
        description: 'Virtual Users (Threads)'
        required: false
        default: '5'
        type: string

      ramp_time:
        description: 'Ramp-up period in seconds'
        required: false
        default: '5'
        type: string

      iterations:
        description: 'Loop iterations per thread'
        required: false
        default: '5'
        type: string

      target_host:
        description: 'Target API Host'
        required: false
        default: 'buggy-books.onrender.com'
        type: string

      target_protocol:
        description: 'Target Protocol (https or http)'
        required: false
        default: 'https'
        type: choice
        options:
          - 'https'
          - 'http'

      branch:
        description: 'Branch to run workflow on'
        required: false
        default: 'main'
        type: string

concurrency:
  group: pages-deploy-allure
  cancel-in-progress: false

permissions: {}

env:
  JMETER_VERSION: '5.6.3'
  JMETER_TEST_DIR: 'jmeter'
  RESULTS_DIR: 'jmeter/Results'
  REPORTS_DIR: 'jmeter/Reports'

jobs:
  run-performance-test:
    name: Run JMeter Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      test_status: ${{ steps.parse-results.outputs.test_status }}
      total_samples: ${{ steps.parse-results.outputs.total_samples }}
      failed_samples: ${{ steps.parse-results.outputs.failed_samples }}
      success_rate: ${{ steps.parse-results.outputs.success_rate }}
      avg_response_time: ${{ steps.parse-results.outputs.avg_response_time }}
      report_ready: ${{ steps.detect-report.outputs.report_ready }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apache JMeter ${{ env.JMETER_VERSION }}
        shell: bash
        run: |
          set -euxo pipefail
          JMETER_ARCHIVE="apache-jmeter-${JMETER_VERSION}.tgz"
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/${JMETER_ARCHIVE}" -o "${RUNNER_TEMP}/${JMETER_ARCHIVE}"
          tar -xzf "${RUNNER_TEMP}/${JMETER_ARCHIVE}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-jmeter-${JMETER_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Pre-Flight Warm-Up Staging Environment
        shell: bash
        env:
          TARGET_HOST: ${{ inputs.target_host || 'buggy-books.onrender.com' }}
        run: |
          if [[ "${TARGET_HOST}" == *"onrender.com"* ]]; then
            echo "Waking Render staging instance: ${TARGET_HOST}..."
            curl -s -o /dev/null -w "Backend wake status: %{http_code}\n" "https://${TARGET_HOST}/api/books" || true
            npx wait-on -t 90000 "https://${TARGET_HOST}/api/books" || true
          fi

      - name: Prepare result directories & select dataset
        id: prep
        shell: bash
        env:
          TEST_PLAN_INPUT: ${{ inputs.test_plan || 'BuggyBooks_Catalog_Load' }}
        run: |
          set -euxo pipefail
          mkdir -p "${RESULTS_DIR}" "${REPORTS_DIR}"
          TEST_PLAN="${TEST_PLAN_INPUT}"

          if [[ "${TEST_PLAN}" == "BuggyBooks_Catalog_Load" ]]; then
            CSV_PATH="${GITHUB_WORKSPACE}/jmeter/TestData/catalog_search.csv"
          elif [[ "${TEST_PLAN}" == "BuggyBooks_Auth_Stress" || "${TEST_PLAN}" == "BuggyBooks_Ecommerce_Journey" ]]; then
            CSV_PATH="${GITHUB_WORKSPACE}/jmeter/TestData/users.csv"
          else
            CSV_PATH="${GITHUB_WORKSPACE}/jmeter/TestData/UserId.csv"
          fi

          echo "csv_path=${CSV_PATH}" >> "${GITHUB_OUTPUT}"
          echo "test_plan=${TEST_PLAN}" >> "${GITHUB_OUTPUT}"

      - name: Execute JMeter Non-GUI Benchmark
        id: run-test
        shell: bash
        env:
          TEST_PLAN: ${{ steps.prep.outputs.test_plan }}
          CSV_PATH: ${{ steps.prep.outputs.csv_path }}
          TARGET_HOST: ${{ inputs.target_host || 'buggy-books.onrender.com' }}
          TARGET_PROTOCOL: ${{ inputs.target_protocol || 'https' }}
          THREAD_COUNT: ${{ inputs.thread_count || '5' }}
          RAMP_TIME: ${{ inputs.ramp_time || '5' }}
          ITERATIONS: ${{ inputs.iterations || '5' }}
        run: |
          set -euxo pipefail
          RESULTS_FILE="${GITHUB_WORKSPACE}/jmeter/Results/${TEST_PLAN}-results.jtl"
          REPORT_DIR="${GITHUB_WORKSPACE}/jmeter/Reports/${TEST_PLAN}-report"
          LOG_FILE="${GITHUB_WORKSPACE}/jmeter/Results/jmeter.log"

          cd "${JMETER_TEST_DIR}"
          jmeter -n \
            -t "Tests/${TEST_PLAN}.jmx" \
            -l "${RESULTS_FILE}" \
            -j "${LOG_FILE}" \
            -e -o "${REPORT_DIR}" \
            -Jhost="${TARGET_HOST}" \
            -Jprotocol="${TARGET_PROTOCOL}" \
            -JbasePath="api" \
            -JTHREAD_COUNT="${THREAD_COUNT}" \
            -JRAMP_TIME="${RAMP_TIME}" \
            -JITERATIONS="${ITERATIONS}" \
            -JCSV_FILE="${CSV_PATH}" \
            -JRESULTS_FILE="${RESULTS_FILE}"

      - name: Parse benchmark results
        id: parse-results
        if: always()
        shell: bash
        env:
          TEST_PLAN: ${{ steps.prep.outputs.test_plan }}
        run: |
          set -euo pipefail
          RESULT_FILE="${GITHUB_WORKSPACE}/jmeter/Results/${TEST_PLAN}-results.jtl"

          if [[ ! -f "${RESULT_FILE}" ]]; then
            echo "test_status=ERROR" >> "${GITHUB_OUTPUT}"
            echo "total_samples=0" >> "${GITHUB_OUTPUT}"
            echo "failed_samples=0" >> "${GITHUB_OUTPUT}"
            echo "success_rate=0.00" >> "${GITHUB_OUTPUT}"
            echo "avg_response_time=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          TOTAL_SAMPLES=$(tail -n +2 "${RESULT_FILE}" | wc -l | tr -d ' ')
          FAILED_SAMPLES=$(tail -n +2 "${RESULT_FILE}" | awk -F',' '$8=="false" {count++} END {print count+0}')

          if [[ "${TOTAL_SAMPLES}" -eq 0 ]]; then
            SUCCESS_RATE="0.00"
            AVG_RESPONSE_TIME="0"
          else
            SUCCESS_RATE=$(awk -v total="${TOTAL_SAMPLES}" -v failed="${FAILED_SAMPLES}" 'BEGIN {printf "%.2f", ((total - failed) * 100) / total}')
            AVG_RESPONSE_TIME=$(tail -n +2 "${RESULT_FILE}" | awk -F',' '{sum+=$2; count++} END {if (count > 0) printf "%.0f", sum / count; else print 0}')
          fi

          if [[ "${FAILED_SAMPLES}" -eq 0 && "${TOTAL_SAMPLES}" -gt 0 ]]; then
            TEST_STATUS="PASSED"
          else
            TEST_STATUS="FAILED"
          fi

          echo "test_status=${TEST_STATUS}" >> "${GITHUB_OUTPUT}"
          echo "total_samples=${TOTAL_SAMPLES}" >> "${GITHUB_OUTPUT}"
          echo "failed_samples=${FAILED_SAMPLES}" >> "${GITHUB_OUTPUT}"
          echo "success_rate=${SUCCESS_RATE}" >> "${GITHUB_OUTPUT}"
          echo "avg_response_time=${AVG_RESPONSE_TIME}" >> "${GITHUB_OUTPUT}"

      - name: Detect generated HTML dashboard report
        id: detect-report
        if: always()
        shell: bash
        env:
          TEST_PLAN: ${{ steps.prep.outputs.test_plan }}
        run: |
          REPORT_DIR="${GITHUB_WORKSPACE}/jmeter/Reports/${TEST_PLAN}-report"
          if [[ -f "${REPORT_DIR}/index.html" ]]; then
            echo "report_ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "report_ready=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload JMeter Dashboard & Results Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.1
        with:
          name: jmeter-${{ steps.prep.outputs.test_plan }}-report
          path: |
            ${{ env.RESULTS_DIR }}
            ${{ env.REPORTS_DIR }}
          retention-days: 14

      - name: Deploy JMeter Report to GitHub Pages
        if: always() && steps.detect-report.outputs.report_ready == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: jmeter/Reports/${{ steps.prep.outputs.test_plan }}-report
          destination_dir: AutomationReports/JMeter
          keep_files: true

      - name: Generate Portal Metadata
        if: always() && steps.detect-report.outputs.report_ready == 'true'
        run: |
          node scripts/generate-portal-metadata.js --output=docs/portal/portal-data.json

      - name: Deploy Executive Portal to GitHub Pages Root
        if: always() && steps.detect-report.outputs.report_ready == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/portal
          keep_files: true

      - name: Generate Quality Gate Step Summary
        if: always()
        shell: bash
        env:
          TEST_PLAN: ${{ steps.prep.outputs.test_plan }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          TARGET_HOST: ${{ inputs.target_host || 'buggy-books.onrender.com' }}
          THREAD_COUNT: ${{ inputs.thread_count || '5' }}
          ITERATIONS: ${{ inputs.iterations || '5' }}
          TEST_STATUS: ${{ steps.parse-results.outputs.test_status }}
          TOTAL_SAMPLES: ${{ steps.parse-results.outputs.total_samples }}
          FAILED_SAMPLES: ${{ steps.parse-results.outputs.failed_samples }}
          SUCCESS_RATE: ${{ steps.parse-results.outputs.success_rate }}
          AVG_RESPONSE_TIME: ${{ steps.parse-results.outputs.avg_response_time }}
        run: |
          {
            echo "## 🚀 JMeter Performance Benchmark Summary"
            echo
            echo "| Metric | Value |"
            echo "| :--- | :--- |"
            echo "| **Test Plan** | \`${TEST_PLAN}.jmx\` |"
            echo "| **Target Host** | \`${TARGET_HOST}\` |"
            echo "| **Virtual Users (Threads)** | \`${THREAD_COUNT}\` |"
            echo "| **Iterations** | \`${ITERATIONS}\` |"
            echo "| **Status** | **${TEST_STATUS}** |"
            echo "| **Total Samples** | \`${TOTAL_SAMPLES}\` |"
            echo "| **Failed Samples** | \`${FAILED_SAMPLES}\` |"
            echo "| **Success Rate** | \`${SUCCESS_RATE}%\` |"
            echo "| **Avg Response Time** | \`${AVG_RESPONSE_TIME} ms\` |"
            echo "| **Report Artifact** | \`jmeter-${TEST_PLAN}-report\` |"
            echo "| **Executive Portal** | [View Quality Portal](https://${OWNER}.github.io/${REPO_NAME}/) |"
            echo "| **Live Dashboard** | [View JMeter Report](https://${OWNER}.github.io/${REPO_NAME}/AutomationReports/JMeter/) |"
          } >> "${GITHUB_STEP_SUMMARY}"
