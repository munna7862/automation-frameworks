name: 'Setup Monorepo Environment'
description: 'Sets up Node.js via .nvmrc, caches npm dependencies, executes npm ci, and optionally installs Google Chrome with ms-playwright caching'

inputs:
  install-chrome:
    description: 'Whether to install Google Chrome browser and system dependencies'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory for npm commands'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js via .nvmrc
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Cache Playwright Google Chrome Binaries
      if: ${{ inputs.install-chrome == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chrome-${{ hashFiles('playwright-e2e/package-lock.json', 'package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-chrome-

    - name: Install Google Chrome and System Dependencies
      if: ${{ inputs.install-chrome == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chrome
